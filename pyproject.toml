[project]
name = "vision-tower-bench"
version = "1.0.0"
description = "Isolates the tower, layer, and projector on frozen open vision encoders"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Immanuel Peter", email = "ipeter@uchicago.edu" }]
keywords = ["vision-transformer", "multimodal", "frozen-features", "probing", "benchmark"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "pillow>=12.3.0",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
figures = [
    "matplotlib>=3.11.1",
]

[project.urls]
Homepage = "https://ipeter.dev/blog/vision-tower-bench"
Repository = "https://github.com/immanuel-peter/vision-tower-bench"
Issues = "https://github.com/immanuel-peter/vision-tower-bench/issues"
Towers = "https://huggingface.co/collections/immanuelpeter/vision-towers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vtb"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
